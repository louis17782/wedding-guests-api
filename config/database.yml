default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: wedding_guests_development
  username: postgres
  password:
  host: localhost

test:
  <<: *default
  database: wedding_guests_test
  username: postgres
  password:
  host: localhost

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
